plugins {
    id "java-library"
    id "eclipse"
    id "idea"
    id "maven-publish"
    id "net.neoforged.moddev.legacyforge" version "2.0.86"
}

group = mod_group_id
version = "${mod_version}+${minecraft_version}"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
    exclude ".cache"
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.main
            gameDirectory.set(file("run/client"))
        }

        server {
            server()
            sourceSet = sourceSets.main
            gameDirectory.set(file("run/server"))
            programArgument("--nogui")
        }

        data {
            data()
            sourceSet = sourceSets.main
            gameDirectory.set(file("run/data"))
            programArguments.addAll("--mod", mod_id)
            programArguments.addAll("--all")
            programArguments.addAll("--output", file("src/generated/resources/").absolutePath)
            programArguments.addAll("--existing", file("src/main/resources/").absolutePath)
        }

        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    maven {
        url = uri("https://cursemaven.com")
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = uri("https://modmaven.dev/")
        content {
            includeGroup "appeng"
        }
    }
    maven {
        name = "GTCEu Maven"
        url = uri("https://maven.gtceu.com")
        content {
            includeGroup "com.gregtechceu.gtceu"
        }
    }
    maven {
        name = "FirstDarkDev"
        url = uri("https://maven.firstdarkdev.xyz/snapshots")
    }
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = uri("https://maven.covers1624.net")
        content {
            includeGroup "mrtjp"
            includeGroup "io.codechicken"
        }
    }
    maven {
        url = uri("https://repo.expandium.net/releases")
    }
}

dependencies {
    compileOnly "org.projectlombok:lombok:1.18.32"
    annotationProcessor "org.projectlombok:lombok:1.18.32"

    modImplementation("appeng:appliedenergistics2-forge:15.4.10") { transitive = false }
    modRuntimeOnly "curse.maven:guideme-1173950:6489464"

    modImplementation("com.gregtechceu.gtceu:gtceu-1.20.1:$gtceu_version") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-1.20.1:$ldlib_version") { transitive = false }
    jarJar(modApi("com.tterrag.registrate:Registrate:MC1.20-1.3.11"))

    modCompileOnly("curse.maven:flux-networks-248020:5234697") { transitive = false }
    modCompileOnly("curse.maven:framedblocks-441647:7386520") { transitive = false }
    modCompileOnly("curse.maven:laserio-626839:5074767") { transitive = false }
    modCompileOnly("io.codechicken:CodeChickenLib:1.20.1-4.4.0.528:universal") { transitive = false }
    modCompileOnly("io.codechicken:CBMultipart:1.20.1-3.3.0.159:universal") { transitive = false }
    modCompileOnly("mrtjp:ProjectRed:1.20.1-4.21.0:core") { transitive = false }
    modCompileOnly("mrtjp:ProjectRed:1.20.1-4.21.0:integration") { transitive = false }
    modCompileOnly("mrtjp:ProjectRed:1.20.1-4.21.0:transmission") { transitive = false }
    modCompileOnly("mrtjp:ProjectRed:1.20.1-4.21.0:illumination") { transitive = false }
    modCompileOnly("mrtjp:ProjectRed:1.20.1-4.21.0:expansion") { transitive = false }
    modCompileOnly("mrtjp:ProjectRed:1.20.1-4.21.0:fabrication") { transitive = false }
    modCompileOnly("mrtjp:ProjectRed:1.20.1-4.21.0:exploration") { transitive = false }
    modCompileOnly("curse.maven:creativecore-257814:8304882") { transitive = false }
    modCompileOnly("curse.maven:littletiles-257818:6610285") { transitive = false }
    modCompileOnly("curse.maven:rechiseled-558998:8301383") { transitive = false }
    modCompileOnly("curse.maven:supermartijn642s-core-lib-454372:7521769") { transitive = false }
    modCompileOnly("curse.maven:supermartijn642s-config-lib-438332:4715408") { transitive = false }
    modCompileOnly("maven.modrinth:fusion-connected-textures:1.3.1-forge-mc1.20.1") { transitive = false }

    compileOnly 'org.jetbrains:annotations:26.1.0'

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.5"))

    compileOnly(annotationProcessor("lu.kolja:mixinloadconditions-common:0.2.0"))
    implementation(jarJar("lu.kolja:mixinloadconditions-forge:0.2.0"))
}

jar {
    manifest.attributes(["MixinConfigs": "${mod_id}.mixins.json"])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.named("processResources", ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version    : forge_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]

    inputs.properties(replaceProperties)

    filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
        expand(replaceProperties)
    }
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            artifact tasks.named("reobfJar")
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            name = "expandium"
            url = uri("https://repo.expandium.net/releases")
            credentials {
                username = providers.environmentVariable("MAVEN_USERNAME").orNull
                password = providers.environmentVariable("MAVEN_PASSWORD").orNull
            }
        }
    }
}

if (file("dev/dev.gradle").exists()) apply from: "dev/dev.gradle"
